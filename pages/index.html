<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de tarefas</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/media.css">
    <script src="https://kit.fontawesome.com/52ff4c741b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="separador">
        <header>
            <h1>Task Manager</h1>
            <p>Gerencie suas tareafas. Organize seu dia</p>
        </header>
        <main>
            <div id="salvar-tarefa">
                <button id="add-tarefa">+ Nova tarefa</button>
                <div id="modal" class="modal">
                    <div class="modal-conteudo">
                        <div id="area-nome-tarefa">
                            <p>Nome da tarefa <input type="text" name="nome-tarefa" id="inome-tarefa" placeholder="Ex: Comprar GTA VI"></p>
                            <p id="msg-nome-tarefa" class="msg"></p>
                        </div>
                        <div id="area-data-tarefa">
                            <p>Data conclusão <input type="date" name="data-conclusao" id="idata-conclusao"></p>
                            <p id="msg-data-tarefa" class="msg"></p>
                        </div>
                        <div id="area-descricao-tarefa">
                            <p>Descreva a tarefa <textarea name="descricao-tarefa" id="idescricao-tarefa" placeholder="Ex: Ir na loja da esquina comprar GTA VI por R$ 450,00"></textarea></p>
                            <p id="msg-descricao-tarefa" class="msg"></p>
                        </div>
                        <button id="save">Salvar</button>
                        <button id="update">Atualizar</button>
                    </div>
                </div>
            </div>
            <div id="area-tarefa">
                <div id="area-pesquisa">
                    <input type="text" name="pesquisar-tarefa" id="ipesquisar-tarefa" placeholder="Pesquisar por nome da tarefa">
                    <select name="filtrar-tarefa" id="ifiltrar-tarefa">
                        <option value="Todas">Todas</option>
                        <option value="True">Concluídas</option>
                        <option value="False">Em andamento</option>
                        <option value="Vencidas">Atrasadas</option>
                    </select>
                    <button id="btn-excluir-todas">Excluir todas as tarefas</button>
                </div>
                <div id="lista-tarefas">

                </div>
            </div>
        </main>
    </div>
    <footer>
        <p>&copy; Site desenvolvido por: <a href="https://github.com/pedrogiacciani" target="_blank">Pedro Giacciani</a></p>
    </footer>
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
